name: Add a robot
description: A humanoid robot that is missing
title: "Add robot: "
labels: [new-robot]
body:
  - type: input
    id: name
    attributes: { label: Robot and company, placeholder: "e.g. Walker S3 by UBTech" }
    validations: { required: true }
  - type: textarea
    id: sources
    attributes: { label: Sources, description: "Links to the official page and any coverage with specs or prices" }
    validations: { required: true }
